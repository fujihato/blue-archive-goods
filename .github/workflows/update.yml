name: SchaleDB connection test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Japanese student data
        run: |
          curl --fail --location --retry 2 --max-time 60 'https://schaledb.com/data/jp/students.json' -o students.json
          python - <<'PY'
          import json
          with open('students.json', encoding='utf-8') as f:
              data = json.load(f)
          rows = list(data.values()) if isinstance(data, dict) else data
          assert len(rows) > 100
          assert any('シロコ' in str(x.get('Name', '')) for x in rows)
          print('Student count:', len(rows))
          print('Fields:', list(rows[0].keys()))
          PY
      - name: Save student data
        uses: actions/upload-artifact@v4
        with:
          name: schaledb-students
          path: students.json
          retention-days: 1
