name: SchaleDB daily update

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SchaleDB data
        run: |
          curl --fail --location --retry 2 --max-time 60 'https://schaledb.com/data/jp/students.json' -o /tmp/schale-students.json

      - name: Update student data
        run: python update.py /tmp/schale-students.json

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add students.json
          git diff --cached --quiet || git commit -m 'Update student data'
          git push

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html students.json public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
