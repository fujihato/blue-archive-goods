<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ブルアカ グッズ収集</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#19364d;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:14px}h1{font-size:23px}header{background:#eef5fa;position:sticky;top:0;z-index:2;padding:8px 0}.stats,#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.stats>div,article,details{background:white;border-radius:12px;padding:12px}progress{width:100%;accent-color:#168bc9}input,select,button{font:inherit;padding:9px;border:1px solid #b5c9d8;border-radius:8px;background:white;color:inherit}input[type=search]{width:100%;margin:8px 0}label{display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;margin:4px 0;background:#f1f5f8}label.yes{background:#d8f3ec}input[type=checkbox]{width:23px;height:23px;accent-color:#168bc9}h2{font-size:19px;margin:0 0 8px}small{color:#526d80}button{cursor:pointer;margin:3px}details{margin:12px 0}form input{max-width:100%;margin:4px}a{color:#24749e}.portrait{width:48px;height:48px;object-fit:contain;flex-shrink:0;background:#e4edf4;border-radius:8px}h2{display:flex;align-items:center;gap:8px}</style><main><h1>ブルーアーカイブ グッズ収集</h1><header><div class="stats" id="stats"></div><input id="q" type="search" placeholder="キャラクター・衣装名を検索"><select id="mode"><option value="all">全グッズ</option><option value="file">メモロビクリアファイル</option><option value="card">誕生日カード</option></select> <select id="filter"><option value="all">全所持状況</option><option value="no">未所持のみ</option><option value="yes">所持済みのみ</option></select> <select id="sort" aria-label="並べ替え"><option value="name">名前順</option><option value="birthday">誕生日順</option><option value="old">実装参考順（古い順）</option><option value="new">実装参考順（新しい順）</option><option value="school">学園別</option></select></header><details><summary>新キャラ・衣装追加／バックアップ</summary><form id="add"><input id="name" required placeholder="キャラクター名" list="students"><datalist id="students"></datalist><input id="variant" placeholder="衣装名（空欄なら通常）"><button>追加</button></form><button id="sync">最新データを読み込む</button><input type="file" id="wikiFile" hidden accept=".html,.htm"><button id="export">バックアップ保存</button><button id="import">復元</button><input type="file" id="backup" hidden accept=".json"><p id="msg" role="status"></p></details><div id="list"></div><p><small>SchaleDBの更新データを使用。全項目を収集対象とし、実際の発売・配布状況は未確認。＊テラーは別キャラ。コラボ4人除外。データ提供：SchaleDB。アイコン表示は試験機能。<a href="https://bluearchive.wikiru.jp/?キャラクター一覧">参照Wiki</a></small></p></main><script>
let base={"アイリ": ["通常", "バンド"], "アオバ": ["通常"], "アカネ": ["通常", "バニーガール", "制服"], "アカリ": ["通常", "正月"], "アコ": ["通常", "ドレス"], "アズサ": ["通常", "水着", "レーシング"], "アスナ": ["通常", "バニーガール", "制服"], "アツコ": ["通常", "水着"], "アヤネ": ["通常", "水着"], "アリス": ["通常", "メイド", "臨戦"], "アル": ["通常", "正月", "ドレス"], "アンナ": ["通常"], "イオリ": ["通常", "水着"], "イズナ": ["通常", "水着"], "イズミ": ["通常", "水着", "正月"], "イチカ": ["通常", "水着"], "イブキ": ["通常", "水着"], "イロハ": ["通常", "水着"], "ウイ": ["通常", "水着"], "ウタハ": ["通常", "応援団"], "ウミカ": ["通常"], "エイミ": ["通常", "水着", "臨戦"], "エリ": ["通常"], "エリカ": ["通常"], "エリナ": ["通常"], "オトギ": ["通常"], "カエデ": ["通常"], "カズサ": ["通常", "バンド"], "カスミ": ["通常", "水着"], "カノエ": ["通常"], "カホ": ["通常"], "カヨコ": ["通常", "正月", "ドレス"], "カリン": ["通常", "バニーガール", "制服"], "カンナ": ["通常", "水着"], "キキョウ": ["通常", "水着"], "キサキ": ["通常", "水着"], "キララ": ["通常"], "キリノ": ["通常", "水着"], "クルミ": ["通常"], "ケイ": ["通常"], "ココナ": ["通常"], "ココロ": ["通常"], "コタマ": ["通常", "キャンプ"], "コトネ": ["通常"], "コトリ": ["通常", "応援団"], "コノカ": ["通常"], "コハル": ["通常", "水着"], "コユキ": ["通常", "パジャマ"], "サオリ": ["通常", "水着", "ドレス"], "サキ": ["通常", "水着"], "サクラコ": ["通常", "アイドル"], "サツキ": ["通常", "水着"], "サヤ": ["通常", "私服"], "シグレ": ["通常", "温泉"], "シズコ": ["通常", "水着"], "シミコ": ["通常"], "ジュリ": ["通常", "アルバイト"], "シュン": ["通常", "幼女", "水着"], "ジュンコ": ["通常", "正月"], "シロコ": ["通常", "ライディング", "水着"], "スズミ": ["通常", "マジカル"], "スバル": ["通常"], "スミレ": ["通常", "アルバイト"], "セイア": ["通常", "水着"], "セナ": ["通常", "私服"], "セリカ": ["通常", "正月", "水着"], "セリナ": ["通常", "クリスマス"], "タカネ": ["通常"], "チアキ": ["通常", "水着"], "チェリノ": ["通常", "温泉"], "チセ": ["通常", "水着"], "チナツ": ["通常", "温泉"], "チヒロ": ["通常"], "ツクヨ": ["通常", "ドレス"], "ツバキ": ["通常", "ガイド"], "ツムギ": ["通常"], "ツルギ": ["通常", "水着"], "トキ": ["通常", "バニーガール", "臨戦"], "トモエ": ["通常", "チーパオ"], "ナギサ": ["通常", "水着"], "ナグサ": ["通常", "水着"], "ナツ": ["通常", "バンド"], "ニコ": ["通常"], "ニヤ": ["通常"], "ネル": ["通常", "バニーガール", "制服"], "ノア": ["通常", "パジャマ"], "ノゾミ": ["通常"], "ノドカ": ["通常", "温泉"], "ノノミ": ["通常", "水着"], "ハスミ": ["通常", "体操服", "水着"], "ハナエ": ["通常", "クリスマス"], "ハナコ": ["通常", "水着"], "ハルカ": ["通常", "正月", "ドレス"], "ハルナ": ["通常", "正月", "体操服"], "ハレ": ["通常", "キャンプ"], "ヒカリ": ["通常"], "ヒナ": ["通常", "水着", "ドレス"], "ヒナタ": ["通常", "水着"], "ヒビキ": ["通常", "応援団"], "ヒフミ": ["通常", "水着", "レーシング"], "ヒマリ": ["通常", "臨戦"], "ヒヨリ": ["通常", "水着"], "フィーナ": ["通常", "ガイド"], "フウカ": ["通常", "正月"], "フブキ": ["通常", "水着"], "フユ": ["通常"], "ホシノ": ["通常", "水着", "臨戦"], "マキ": ["通常", "キャンプ"], "マコト": ["通常", "水着"], "マシロ": ["通常", "水着"], "マリー": ["通常", "体操服", "アイドル"], "マリナ": ["通常", "チーパオ"], "ミカ": ["通常", "水着"], "ミサキ": ["通常", "水着"], "ミチル": ["通常", "ドレス"], "ミドリ": ["通常", "メイド"], "ミナ": ["通常"], "ミネ": ["通常", "アイドル"], "ミノリ": ["通常"], "ミモリ": ["通常", "水着"], "ミヤコ": ["通常", "水着"], "ミユ": ["通常", "水着"], "ミヨ": ["通常"], "ムツキ": ["通常", "正月", "ドレス"], "メグ": ["通常"], "メル": ["通常"], "モエ": ["通常", "水着"], "モミジ": ["通常"], "モモイ": ["通常", "メイド"], "ヤクモ": ["通常"], "ユウカ": ["通常", "体操服", "パジャマ"], "ユカリ": ["通常", "水着"], "ユズ": ["通常", "メイド", "臨戦"], "ヨシミ": ["通常", "バンド"], "ラナ": ["通常"], "ラブ": ["通常"], "リオ": ["通常", "臨戦"], "リツ": ["通常"], "ルミ": ["通常"], "レイ": ["通常"], "レイサ": ["通常", "マジカル"], "レイジョ": ["通常"], "レナ": ["通常"], "レンゲ": ["通常", "水着"], "ワカモ": ["通常", "水着"], "シロコ＊テラー": ["通常"]};const $=id=>document.getElementById(id);const key='ba-goods-v2';let state={extra:{},owned:[]};function valid(x){return x&&x.extra&&typeof x.extra==='object'&&!Array.isArray(x.extra)&&Object.values(x.extra).every(v=>Array.isArray(v)&&v.every(s=>typeof s==='string'))&&Array.isArray(x.owned)&&x.owned.every(s=>typeof s==='string')}try{let x=JSON.parse(localStorage.getItem(key));if(valid(x))state=x}catch(e){}state=migrate(state);function save(){try{localStorage.setItem(key,JSON.stringify(state));$('msg').textContent='端末に保存済み'}catch(e){$('msg').textContent='自動保存できません。バックアップを保存してください。'}}function groups(){let m=new Map(Object.entries(base));for(let [n,v] of Object.entries(state.extra))m.set(n,[...new Set([...(m.get(n)||[]),...v])]);return [...m].sort(compareGroups)}const id=(n,v)=>JSON.stringify([n,v]);function render(){let g=groups(),owned=new Set(state.owned),files=g.flatMap(([n,vs])=>vs.map(v=>id(n,v))),cards=g.map(([n])=>id(n,null));$('stats').replaceChildren();for(let [title,keys] of [['メモロビクリアファイル',files],['誕生日カード',cards]]){let count=keys.filter(k=>owned.has(k)).length,d=document.createElement('div'),p=document.createElement('progress');d.textContent=title+'　'+count+' / '+keys.length+' ('+(100*count/keys.length).toFixed(1)+'%)';p.max=keys.length;p.value=count;d.append(p);$('stats').append(d)}$('list').replaceChildren();$('students').replaceChildren();for(let [n,vs] of g){let opt=document.createElement('option');opt.value=n;$('students').append(opt);let a=document.createElement('article'),h=document.createElement('h2');h.textContent=n;a.append(h);let meta=metadata(n,vs),sub=document.createElement('small');sub.textContent=[meta.school,Number.isFinite(meta.day)?Math.floor(meta.day/100)+'月'+meta.day%100+'日':'誕生日不明'].filter(Boolean).join(' ・ ');a.append(sub);let rows=[...( $('mode').value==='file'?[]:[[null,'🎂 誕生日カード']]),...($('mode').value==='card'?[]:vs.map(v=>[v,'📁 '+v]))];for(let [v,t] of rows){let k=id(n,v),yes=owned.has(k),q=$('q').value.normalize('NFKC');if(!(n+' '+(v||'誕生日カード')).normalize('NFKC').includes(q)||($('filter').value==='yes'&&!yes)||($('filter').value==='no'&&yes))continue;let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=yes;l.className=yes?'yes':'';c.onchange=()=>{c.checked?owned.add(k):owned.delete(k);state.owned=[...owned];save();render()};l.append(c,portrait(n,v),document.createTextNode(t));a.append(l)}if(a.children.length>2)$('list').append(a)}}for(let k of ['q','mode','filter','sort'])$(k).oninput=render;$('add').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim(),v=$('variant').value.trim()||'通常';if(!n)return;if(excluded(n)){alert("コラボキャラは対象外です");return;}let m=new Map(Object.entries(state.extra));m.set(n,[...new Set([...(m.get(n)||[]),v])]);state.extra=Object.fromEntries(m);save();render();$('add').reset()};$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.href=u;a.download='ba-goods-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('backup').click();$('backup').onchange=async()=>{try{let x=JSON.parse(await $('backup').files[0].text());if(!valid(x))throw Error();if(confirm('現在の所持状況と追加データをバックアップで置き換えますか？')){state=migrate(x);save();render()}}catch(e){alert('この版のバックアップを読み込めませんでした')} $('backup').value=''};
const remoteIcons=new Map();
const schools={Abydos:'アビドス',Gehenna:'ゲヘナ',Trinity:'トリニティ',Millennium:'ミレニアム',Hyakkiyako:'百鬼夜行',Shanhaijing:'山海経',RedWinter:'レッドウィンター',Valkyrie:'ヴァルキューレ',SRT:'SRT',Arius:'アリウス',Highlander:'ハイランダー',WildHunt:'ワイルドハント',Odyssey:'オデュッセイア',ETC:'その他'};
function metadata(n,vs){let rows=vs.map(v=>remoteIcons.get(id(n,v))).filter(Boolean);let r=remoteIcons.get(id(n,'通常'))||rows[0]||{};let orders=rows.map(x=>x.order).filter(Number.isFinite);let match=String(r.birthday||'').match(/^(\d{1,2})\/(\d{1,2})$/);let day=match&&+match[1]>=1&&+match[1]<=12&&+match[2]>=1&&+match[2]<=31?+match[1]*100 + +match[2]:Infinity;return {day,school:schools[r.school]||r.school||'',order:orders.length?Math.min(...orders):Infinity};}
function compareGroups(a,b){let x=metadata(...a),y=metadata(...b),mode=$('sort').value;let name=a[0].localeCompare(b[0],'ja');if(mode==='birthday')return (x.day-y.day)||name;if(mode==='old'||mode==='new'){if(!Number.isFinite(x.order)||!Number.isFinite(y.order))return (Number.isFinite(y.order)-Number.isFinite(x.order))||name;return (mode==='old'?x.order-y.order:y.order-x.order)||name;}if(mode==='school')return (Number(!x.school)-Number(!y.school))||x.school.localeCompare(y.school,'ja')||name;return name;}
const wiki='https://bluearchive.wikiru.jp/?'+encodeURIComponent('キャラクター一覧');
function excluded(n){return ['初音ミク','佐天涙子','御坂美琴','食蜂操祈'].includes(n)}
function migrate(x){x.extra=Object.fromEntries(Object.entries(x.extra).filter(([n])=>!excluded(n)));if(x.extra['シロコ'])x.extra['シロコ']=x.extra['シロコ'].filter(v=>v!=='テラー');x.owned=[...new Set(x.owned.map(k=>k===JSON.stringify(['シロコ','テラー'])?JSON.stringify(['シロコ＊テラー','通常']):k))].filter(k=>{try{return !excluded(JSON.parse(k)[0])}catch{return false}});x.icons=x.icons||{};return x}
function portrait(n,v){let img=document.createElement('img');img.className='portrait';img.loading='lazy';img.alt='';let row=remoteIcons.get(id(n,v||'通常'));let url=row?`https://schaledb.com/images/student/icon/${row.id}.webp`:null;if(url)img.src=url;else img.hidden=true;img.onerror=()=>{img.hidden=true};return img}
function parseWiki(html){let doc=new DOMParser().parseFromString(html,'text/html'),root=doc.querySelector('#body')||doc.querySelector('main')||doc;let known=new Set(Object.entries(base).flatMap(([n,vs])=>vs.map(v=>v==='通常'?n:n+'（'+v+'）')));let best=[],score=0;for(let table of root.querySelectorAll('table')){let rows=[];for(let tr of table.querySelectorAll('tr')){for(let a of tr.querySelectorAll('a[href]')){let t=a.textContent.trim();if(!t)continue;let match=t.match(/^([ァ-ヶー・＊*]+)(?:[（(]([^）)]+)[）)])?$/);if(!match)continue;let n=match[1].replaceAll('*','＊'),v=match[2]||'通常';if(excluded(n))continue;let im=tr.querySelector('img');let src=im&&(im.getAttribute('data-src')||im.getAttribute('src'));let url='';try{if(src){let u=new URL(src,wiki);if(u.origin===new URL(wiki).origin)url=u.href}}catch{}rows.push({n,v,t,url});break}}let hits=rows.filter(r=>known.has(r.t)).length;if(hits>score){score=hits;best=rows}}if(score<20)throw Error('生徒一覧の表を特定できませんでした');return best}
function applyWiki(html){let rows=parseWiki(html),g=new Map(groups()),added=[];for(let {n,v,url} of rows){if(!g.get(n)?.includes(v))added.push(n+'（'+v+'）');}if(!confirm('Wikiから '+rows.length+' 件を検出。新規候補 '+added.length+' 件：\n'+added.join('、')+'\n追加・画像更新しますか？'))return;for(let {n,v,url} of rows){if(!g.get(n)?.includes(v)){state.extra[n]=[...new Set([...(state.extra[n]||[]),v])]}if(url)state.icons[id(n,v)]=url}save();render();$('msg').textContent='更新完了：新規候補 '+added.length+' 件、画像登録 '+Object.keys(state.icons).length+' 件（表示は通信状況によります）'}
async function sync(){try{let r=await fetch('students.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let rows=await r.json();if(!Array.isArray(rows)||rows.length<200)throw Error('データ形式エラー');for(let x of rows){if(excluded(x.n))continue;base[x.n]=[...new Set([...(base[x.n]||[]),x.v])];remoteIcons.set(id(x.n,x.v),x)}render();$('msg').textContent='最新データ取得完了：'+rows.length+'種'}catch(e){$('msg').textContent='更新失敗：'+e.message+'。既存一覧を維持します'}}$('sync').onclick=sync;try{$('sort').value=localStorage.getItem('ba-goods-sort')||'name';if(!$('sort').value)$('sort').value='name'}catch{}$('sort').oninput=()=>{try{localStorage.setItem('ba-goods-sort',$('sort').value)}catch{}render()};render();sync();</script></html>
